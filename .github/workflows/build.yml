name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-14 — это Apple Silicon (arm64), та же архитектура, что у M1.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/sysmon-core

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests (sysmon-core)
        working-directory: crates/sysmon-core
        run: cargo test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build app
        run: npm run tauri build -- --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SystemMonitor-macOS-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Панель в вырезе: форк cyclop (notch/) с вкладками System Monitor.
  notch:
    # macOS 15 — минимум cyclop: Translation.framework младше не бывает.
    runs-on: macos-15
    defaults:
      run:
        working-directory: notch
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/sysmon-core

      - name: Ключи перевода совпадают с кодом
        run: |
          python3 - <<'PY'
          import re, io, pathlib, sys
          pat = re.compile(r'\b(?:localized|Text|Button|TextField)\(\s*"((?:[^"\\]|\\.)+)"')
          code = set()
          for p in pathlib.Path("Sources").rglob("*.swift"):
              for m in pat.finditer(io.open(p, encoding="utf-8").read()):
                  key = m.group(1)
                  if "\\(" in key or not any(c.isalpha() for c in key):
                      continue
                  code.add(key.replace("\\n", "\n"))
          bad = False
          for table in pathlib.Path("Resources").glob("*.lproj/Localizable.strings"):
              text = io.open(table, encoding="utf-8").read()
              keys = {k.replace("\\n", "\n") for k in re.findall(r'^"((?:[^"\\]|\\.)*)"\s*=', text, re.M)}
              missing = code - keys
              if missing:
                  bad = True
                  print(f"{table}: нет ключей: {sorted(missing)}")
          sys.exit(1 if bad else 0)
          PY

      - name: Тесты cyclop
        run: ./Scripts/test.sh

      - name: Сборка приложения
        run: ./Scripts/bundle.sh release

      - name: Помощник в бандле и отвечает
        run: |
          APP=build/Cyclop.app
          test -x "$APP/Contents/MacOS/sysmon-helper"
          codesign --verify --strict "$APP"
          OUT="$( (echo '{"cmd":"watch","system":true}'; sleep 3) | "$APP/Contents/MacOS/sysmon-helper" | head -1)"
          echo "$OUT" | cut -c1-300
          echo "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["type"]=="system" and d["data"]["memory"]["total"]>0'

      - name: Приложение переживает запуск
        run: |
          set -u
          LOG="$RUNNER_TEMP/cyclop.log"
          build/Cyclop.app/Contents/MacOS/Cyclop >"$LOG" 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            echo "приложение прожило 15 секунд"
            exit 0
          fi
          set +e
          wait "$PID" 2>/dev/null
          echo "::error::Cyclop не пережил запуск, код $?"
          cat "$LOG" || true
          for f in "$HOME/Library/Logs/DiagnosticReports"/Cyclop*.ips; do
            [ -e "$f" ] || continue
            head -c 4000 "$f"
          done
          exit 1

      - name: Упаковать
        run: ditto -c -k --keepParent build/Cyclop.app build/Cyclop-SystemMonitor.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cyclop-SystemMonitor-macOS-arm64
          path: notch/build/Cyclop-SystemMonitor.zip
          if-no-files-found: error
