<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside class="sidebar" data-tauri-drag-region>
      <nav class="nav" id="nav"></nav>
    </aside>

    <div class="content" id="content">
      <header class="titlebar" data-tauri-drag-region>
        <h1 id="section-title" data-tauri-drag-region>Обзор</h1>
        <div class="host" id="host" data-tauri-drag-region></div>
      </header>

      <main>
        <section class="section" id="overview">
          <div class="panel strip" id="overview-strip"></div>
        </section>

        <section class="section" id="cpu">
          <h2>Процессор</h2>
          <div class="panel" id="cpu-body"></div>
        </section>

        <section class="section" id="memory">
          <h2>Память</h2>
          <div class="panel" id="memory-body"></div>
          <h3>Процессы по памяти</h3>
          <div class="panel flush"><table class="table" id="memory-procs"></table></div>
        </section>

        <section class="section" id="network">
          <h2>Сеть</h2>
          <div class="panel" id="network-body"></div>
          <h3>Интерфейсы</h3>
          <div class="panel flush"><table class="table" id="network-ifaces"></table></div>
          <h3>Программы с открытыми соединениями</h3>
          <div class="panel flush"><table class="table" id="network-apps"></table></div>
          <h3>Открытые порты</h3>
          <div class="panel flush"><table class="table" id="network-ports"></table></div>
        </section>

        <section class="section" id="disks">
          <h2>Диски</h2>
          <div class="panel" id="disks-body"></div>
          <div class="panel hint" id="fda-hint" hidden></div>
          <h3>Что занимает место</h3>
          <div class="toolbar">
            <button class="btn primary" id="scan-home">Домашняя папка</button>
            <button class="btn" id="scan-apps">Программы</button>
            <button class="btn" id="scan-pick">Другая папка…</button>
            <button class="btn" id="scan-stop" hidden>Остановить</button>
          </div>
          <div id="scan-body"></div>
          <h3>Программы</h3>
          <div id="apps-body"></div>
          <h3>Быстрая очистка</h3>
          <div id="cleanup-body"></div>
        </section>

        <section class="section" id="devices">
          <h2>Устройства</h2>
          <h3>Этот Mac</h3>
          <div class="panel" id="battery-body"></div>
          <div class="toolbar sub">
            <h3>Bluetooth</h3>
            <span class="spacer"></span>
            <button class="btn small" id="devices-refresh">Обновить</button>
          </div>
          <div class="panel flush" id="devices-body"></div>
        </section>

        <section class="section" id="processes">
          <h2>Процессы</h2>
          <div class="toolbar">
            <input id="proc-search" type="search" placeholder="Поиск по имени или PID" autocomplete="off" />
            <span class="muted" id="proc-count"></span>
          </div>
          <div class="panel flush scroll"><table class="table" id="proc-table"></table></div>
        </section>

        <section class="section" id="docker">
          <h2>Docker</h2>
          <div id="docker-body"></div>
        </section>
      </main>
    </div>

    <dialog id="logs">
      <div class="dialog-head">
        <strong id="logs-title"></strong>
        <button class="btn" id="logs-close">Закрыть</button>
      </div>
      <pre id="logs-body"></pre>
    </dialog>

    <dialog id="confirm" class="confirm">
      <div class="dialog-head"><strong id="confirm-title"></strong></div>
      <div class="confirm-body" id="confirm-body"></div>
      <div class="dialog-foot">
        <button class="btn" id="confirm-cancel">Отмена</button>
        <button class="btn primary" id="confirm-ok">OK</button>
      </div>
    </dialog>

    <div class="selbar" id="selbar" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
