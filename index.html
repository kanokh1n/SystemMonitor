<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Monitor</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside class="sidebar" data-tauri-drag-region>
      <nav class="nav" role="tablist">
        <button class="tab active" data-tab="overview" data-title="Обзор">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h4l3-8 4 14 3-6h4"/></svg><span>Обзор</span><small id="badge-overview"></small>
        </button>
        <button class="tab" data-tab="processes" data-title="Процессы">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 14h8"/></svg><span>Процессы</span><small id="badge-processes"></small>
        </button>
        <button class="tab" data-tab="disks" data-title="Диски">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Диски</span><small id="badge-disks"></small>
        </button>
        <button class="tab" data-tab="battery" data-title="Батарея">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4"/></svg><span>Батарея</span><small id="badge-battery"></small>
        </button>
        <button class="tab" data-tab="docker" data-title="Docker">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h16a4 4 0 0 1-4 5H8a5 5 0 0 1-5-5zM5 9h3v3H5zM8 9h3v3H8zM11 9h3v3h-3zM8 6h3v3H8z"/></svg><span>Docker</span><small id="badge-docker"></small>
        </button>
      </nav>
    </aside>

    <div class="content">
      <header class="titlebar" data-tauri-drag-region>
        <h1 id="section-title" data-tauri-drag-region>Обзор</h1>
        <div class="host" id="host" data-tauri-drag-region></div>
      </header>

      <main>
        <section id="overview" class="view active">
          <div class="grid">
            <article class="card" id="card-cpu"></article>
            <article class="card" id="card-mem"></article>
            <article class="card" id="card-net"></article>
            <article class="card" id="card-system"></article>
            <article class="card wide" id="card-top"></article>
          </div>
        </section>

        <section id="processes" class="view">
          <div class="toolbar">
            <input id="proc-search" type="search" placeholder="Поиск по имени или PID" autocomplete="off" />
            <span class="muted" id="proc-count"></span>
          </div>
          <div class="table-wrap"><table class="table" id="proc-table"></table></div>
        </section>

        <section id="disks" class="view">
          <div class="grid" id="disks-volumes"></div>
          <article class="card full" id="disks-io"></article>
          <article class="card full soon">
            <h2>Очистка диска</h2>
            <p class="muted">Скоро здесь: что занимает больше всего места, удаление файлов и приложений в Корзину.</p>
          </article>
        </section>

        <section id="battery" class="view">
          <div class="grid">
            <article class="card" id="battery-main"></article>
            <article class="card soon">
              <h2>Другие устройства</h2>
              <p class="muted">Скоро здесь: заряд наушников, мыши, клавиатуры и других Bluetooth‑устройств.</p>
            </article>
          </div>
        </section>

        <section id="docker" class="view">
          <div id="docker-body"></div>
        </section>
      </main>
    </div>

    <dialog id="logs">
      <div class="dialog-head">
        <strong id="logs-title"></strong>
        <button class="btn" id="logs-close">Закрыть</button>
      </div>
      <pre id="logs-body"></pre>
    </dialog>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
