[package]
name = "system-monitor"
version = "0.1.0"
description = "Системный монитор для macOS: CPU, память, диск, сеть, батарея, процессы и Docker"
authors = ["Kanokhin"]
edition = "2021"

[lib]
name = "system_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
bollard = "0.21"
starship-battery = "0.12"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
