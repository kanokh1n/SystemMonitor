[package]
name = "system-monitor"
version = "0.1.0"
description = "Системный монитор для macOS: CPU, память, диск, сеть, батарея и Bluetooth‑устройства, процессы, Docker и серверы по SSH"
authors = ["Kanokhin"]
edition = "2021"

[lib]
name = "system_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sysmon-core = { path = "../crates/sysmon-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
bollard = "0.21"
starship-battery = "0.12"
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
trash = "5.2.9"
rayon = "1.12.0"
plist = "1.10.2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
